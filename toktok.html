<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توك توك سوهاج</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#12355B;--road:#F2B705;--bg:#F3F6F9;--card:#fff;--line:#D8E0E8;--ok:#1E9E6A;--bad:#C0392B;--mut:#5C6B7A;--txt:#14202B}
@media (prefers-color-scheme:dark){:root{--bg:#0E1A26;--card:#162636;--line:#27405A;--txt:#EAF0F6;--mut:#9DB0C2}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
header{background:#12355B;color:#fff;padding:12px 16px}
.hrow{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto}
header h1{margin:0;font-size:20px;font-weight:800}
header h1 span{color:var(--road)}
.acct{font-size:13px;color:#B9CCE0;display:flex;align-items:center;gap:10px}
.acct button{background:transparent;border:1px solid #4d6c8f;color:#fff;border-radius:6px;padding:2px 10px;font:600 13px Cairo,Tahoma;cursor:pointer}
#mapwrap{max-width:560px;margin:0 auto;position:relative}
#map{height:280px;background:#dfe7ee;direction:ltr}
#hint{position:absolute;top:8px;right:8px;left:8px;z-index:500;background:rgba(18,53,91,.92);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;text-align:center;pointer-events:none}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.a{background:#1E9E6A}.pin.b{background:#F2B705}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select{width:100%;font:400 15px Cairo,Tahoma;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--road);outline-offset:1px}
.btn{background:var(--road);color:#12355B;border:0;border-radius:8px;font:800 16px Cairo,Tahoma;padding:12px;width:100%;margin-top:14px;cursor:pointer}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:600;margin-top:8px}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line);font-weight:600;margin-top:8px}
.seg2{display:flex;gap:4px;margin-bottom:6px}
.seg2 button{flex:1;border:0;border-bottom:3px solid var(--line);background:transparent;color:var(--mut);font:600 15px Cairo,Tahoma;padding:8px;cursor:pointer}
.seg2 button.on{border-color:var(--road);color:var(--txt)}
.picks{display:flex;gap:8px}
.pick{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--txt);border-radius:8px;padding:8px;font:600 14px Cairo,Tahoma;cursor:pointer}
.pick.on{border-color:var(--road)}.pick.set{background:rgba(30,158,106,.12)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.id{font-weight:800}.fee{font-weight:800;color:var(--ok)}
.addr{margin:8px 0 0;font-size:14px;color:var(--mut)}.addr b{color:var(--txt)}
.addr a{color:var(--ink);font-weight:600}
.route{display:flex;align-items:center;margin:14px 4px 4px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--ok)}.dot.now{background:var(--road);box-shadow:0 0 0 4px rgba(242,183,5,.3)}
.seg{height:4px;flex:1;background:var(--line)}.seg.done{background:var(--ok)}
.steps{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:0 -4px}
.steps span{flex:1;text-align:center}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bad);color:var(--bad)}
.bal{display:flex;justify-content:space-between;align-items:center}
.bal b{font-size:24px;color:var(--ok)}
h2{font-size:16px;margin:18px 0 8px}
.wait{color:var(--ink);font-weight:600}
.err{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<header><div class="hrow"><h1>توك توك سوهاج<span>.</span></h1><div class="acct" id="acct" hidden></div></div></header>
<div id="mapwrap" hidden><div id="map"></div><div id="hint"></div></div>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STEPS=['بدور على سواق','السواق جاي','السواق وصل','في الطريق','وصلنا'];
const DRIVER_BTN=['','وصلت لمكان الراكب','الراكب ركب، ابدأ الرحلة','وصلنا الوجهة'];
const TKEY='toktok.token';
const CENTER=[26.5569,31.6948], BOUNDS=[[26.46,31.58],[26.65,31.82]];
let token=lsGet(TKEY), user=null, authMode='login', booted=false;
let cache=[], lastJson='[]', pending=false, toast='', gpsMsg='';
let pFrom=null, pTo=null, mode='from', sel=null, map=null, layer=null;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tel=p=>p?`<a href="tel:${esc(p)}" dir="ltr">${esc(p)}</a>`:'';

/* ---------- الاتصال بالسيرفر ---------- */
async function api(path,body,noAuth){
  try{
    const h={};if(body)h['Content-Type']='application/json';if(token&&!noAuth)h.Authorization='Bearer '+token;
    const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});
    const d=await r.json();
    if(r.status===401&&!noAuth){clearSession('انتهت الجلسة. سجّل دخول تاني.');return null}
    if(!r.ok){toast=d.error||'حصلت مشكلة.';return null}
    toast='';return d;
  }catch(e){toast='مفيش اتصال بالسيرفر.';return null}
}
function clearSession(msg){token=null;user=null;cache=[];lastJson='[]';sel=null;pFrom=pTo=null;mode='from';lsSet(TKEY,null);toast=msg||'';render()}
async function logout(){await api('logout',{});clearSession('')}
async function refresh(force){
  if(!user)return;
  const d=await api('rides');
  if(!d){if(user)render();return}
  const j=JSON.stringify(d);
  if(j===lastJson&&!force)return;
  lastJson=j;cache=d;
  const el=document.activeElement;
  if(!force&&el&&/INPUT|SELECT/.test(el.tagName)){pending=true;return} // ما نقطعش الكتابة
  render();
}
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,50)}});

/* ---------- الدخول والتسجيل ---------- */
function authView(){
  const reg=authMode==='register';
  return `<div class="card">
    <div class="seg2"><button class="${reg?'':'on'}" onclick="authMode='login';toast='';render()">دخول</button>
    <button class="${reg?'on':''}" onclick="authMode='register';toast='';render()">حساب جديد</button></div>
    ${reg?`<label>اسمك</label><input id="aname" autocomplete="name">
    <label>أنت</label><select id="arole" onchange="document.getElementById('plwrap').hidden=this.value!=='driver'"><option value="rider">راكب</option><option value="driver">سواق توك توك</option></select>
    <div id="plwrap" hidden><label>رقم التوك توك / اللوحة</label><input id="aplate"></div>`:''}
    <label>رقم الموبايل</label><input id="aphone" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx" autocomplete="tel">
    <label>الرمز السري (4 لـ 8 أرقام)</label><input id="apin" type="password" inputmode="numeric" dir="ltr" autocomplete="${reg?'new-password':'current-password'}">
    <button class="btn" onclick="submitAuth()">${reg?'إنشاء الحساب':'دخول'}</button>
  </div>`;
}
async function submitAuth(){
  const v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
  const reg=authMode==='register';
  const b={phone:v('aphone'),pin:v('apin')};
  if(reg){b.name=v('aname');b.role=v('arole');b.plate=v('aplate')}
  const d=await api(reg?'register':'login',b,true);
  if(!d){render();return}
  token=d.token;user=d.user;lsSet(TKEY,token);
  boot();render();refresh(true);
}

/* ---------- الخريطة ---------- */
function initMap(){
  const el=document.getElementById('map');
  if(!window.L){el.innerHTML='<p class="empty">الخريطة محتاجة إنترنت عشان تتحمّل.</p>';return}
  map=L.map('map',{center:CENTER,zoom:14,minZoom:12,maxZoom:18,maxBounds:BOUNDS,maxBoundsViscosity:1});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('click',e=>{
    if(!user||user.role!=='rider')return;
    const p=[e.latlng.lat,e.latlng.lng];
    if(mode==='from'){pFrom=p;mode=pTo?'from':'to'}else{pTo=p}
    render();
  });
}
const pin=c=>L.divIcon({className:'',html:`<div class="pin ${c}"></div>`,iconSize:[26,26],iconAnchor:[4,26]});
function drawMap(){
  if(!map||!user)return;
  layer.clearLayers();
  let a=null,b=null;
  if(user.role==='rider'){a=pFrom;b=pTo}
  else{const r=cache.find(x=>x.id===sel);if(r){a=r.fromLL;b=r.toLL}}
  if(a)L.marker(a,{icon:pin('a')}).addTo(layer);
  if(b)L.marker(b,{icon:pin('b')}).addTo(layer);
  if(a&&b){L.polyline([a,b],{color:'#12355B',weight:4,dashArray:'6 8'}).addTo(layer);map.fitBounds([a,b],{padding:[40,40],maxZoom:16})}
  else if(a||b)map.setView(a||b,15);
  document.getElementById('hint').textContent=user.role==='rider'
    ?(!pFrom&&mode==='from'?'اضغط على الخريطة لتحديد مكان ركوبك':!pTo?'دلوقتي اضغط على مكان الوجهة':'تمام. تقدر تغيّر أي نقطة من الأزرار تحت')
    :(sel?'الأخضر: مكان الراكب · الأصفر: الوجهة':'اضغط «عرض على الخريطة» في أي رحلة');
}
function locate(){
  if(!navigator.geolocation){gpsMsg='المتصفح مش بيدعم تحديد الموقع. حدّد على الخريطة بإيدك.';render();return}
  gpsMsg='بنحدّد موقعك...';render();
  navigator.geolocation.getCurrentPosition(pos=>{
    const p=[pos.coords.latitude,pos.coords.longitude];
    const inside=p[0]>=BOUNDS[0][0]&&p[0]<=BOUNDS[1][0]&&p[1]>=BOUNDS[0][1]&&p[1]<=BOUNDS[1][1];
    if(!inside)gpsMsg='موقعك خارج نطاق سوهاج. حدّد المكان على الخريطة.';
    else{pFrom=p;mode='to';gpsMsg=''}
    render();
  },()=>{gpsMsg='ما قدرناش نوصل لموقعك. اسمح للمتصفح بالموقع، أو حدّد على الخريطة بإيدك.';render()},
  {enableHighAccuracy:true,timeout:10000});
}
function dist(a,b){
  const R=6371,t=x=>x*Math.PI/180,dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;
  return Math.max(1,Math.round(2*R*Math.asin(Math.sqrt(h))*1.3*10)/10);
}
const kmNow=()=>pFrom&&pTo?dist(pFrom,pTo):null;
const fareFor=k=>Math.round(10+k*4);

/* ---------- الشاشات ---------- */
function progress(s){
  let h='<div class="route">';
  STEPS.forEach((_,i)=>{
    h+=`<div class="dot ${i<s?'done':i==s?'now':''}"></div>`;
    if(i<STEPS.length-1)h+=`<div class="seg ${i<s?'done':''}"></div>`;
  });
  return h+'</div><div class="steps">'+STEPS.map(x=>`<span>${x}</span>`).join('')+'</div>';
}
function rideCard(r,actions,forDriver){
  const cancelled=r.status==='cancelled';
  return `<div class="card">
    <div class="top"><span class="id">رحلة #${r.id}</span>
      ${cancelled?'<span class="tag">ملغية</span>':`<span class="fee">${r.fare} ج</span>`}</div>
    <p class="addr">من: <b>${esc(r.fromTxt)}</b><br>إلى: <b>${esc(r.toTxt)}</b><br>
      ${r.pax} ${r.pax>2?'ركّاب':r.pax==2?'راكبين':'راكب'} · ${r.km} كم${forDriver&&r.phone?` · هاتف الراكب: ${tel(r.phone)}`:''}</p>
    ${!forDriver&&r.driverName&&!cancelled?`<p class="addr">السواق: <b>${esc(r.driverName)}</b> · توك توك <b>${esc(r.plate)}</b>${r.driverPhone?` · ${tel(r.driverPhone)}`:''}</p>`:''}
    ${cancelled?'':progress(r.step)}
    ${actions||''}
  </div>`;
}
function riderView(){
  const mine=[...cache].reverse(), k=kmNow();
  return `<div class="card"><b>اطلب توك توك</b>
    <label>حدّد على الخريطة</label>
    <div class="picks">
      <button class="pick ${mode==='from'?'on':''} ${pFrom?'set':''}" onclick="mode='from';render()">${pFrom?'✓ ':''}مكان الركوب</button>
      <button class="pick ${mode==='to'?'on':''} ${pTo?'set':''}" onclick="mode='to';render()">${pTo?'✓ ':''}الوجهة</button>
    </div>
    <button class="btn sec" style="margin-top:8px" onclick="locate()">📍 حدّد موقعي الحالي كمكان ركوب</button>
    <p class="addr err">${gpsMsg}</p>
    <label>وصف مكان الركوب (اختياري)</label><input id="fromTxt" placeholder="مثال: قدام محطة القطر">
    <label>وصف الوجهة (اختياري)</label><input id="toTxt" placeholder="مثال: جامعة سوهاج">
    <label>عدد الركّاب</label><select id="pax"><option>1</option><option>2</option><option>3</option></select>
    <p class="addr">${k?`المسافة التقريبية: <b>${k} كم</b> · الأجرة: <span class="fee">${fareFor(k)} ج</span> (كاش للسواق)`:'حدّد نقطتين على الخريطة عشان تظهر الأجرة.'}</p>
    <button class="btn" onclick="request()">اطلب توك توك</button>
  </div>
  <h2>رحلاتي</h2>
  ${mine.length?mine.map(r=>rideCard(r,r.status==='open'?`<p class="addr wait">بندوّر على أقرب سواق...</p><button class="btn bad" onclick="cancel(${r.id})">إلغاء الطلب</button>`:'',false)).join(''):'<div class="empty">لسه ما طلبتش توك توك. حدّد مكانك على الخريطة واطلب أول رحلة.</div>'}`;
}
async function request(){
  const v=id=>document.getElementById(id).value.trim();
  if(!pFrom||!pTo){toast='حدّد مكان الركوب والوجهة على الخريطة الأول.';render();return}
  const d=await api('rides',{fromLL:pFrom,toLL:pTo,fromTxt:v('fromTxt'),toTxt:v('toTxt'),pax:+v('pax')});
  if(d){pFrom=pTo=null;mode='from';gpsMsg='';await refresh(true)}else render();
}
async function cancel(id){await api(`rides/${id}/cancel`,{});await refresh(true)}

function driverView(){
  const open=cache.filter(r=>r.status==='open').reverse();
  const mine=cache.filter(r=>r.mine&&r.status!=='cancelled').reverse();
  const active=mine.filter(r=>r.step<4), done=mine.filter(r=>r.step===4);
  const earn=done.reduce((s,r)=>s+r.fare,0);
  const show=r=>`<button class="btn sec" onclick="sel=${r.id};render()">عرض على الخريطة</button>`;
  return `<div class="card bal"><div>أرباحك<br><span class="addr">${done.length} رحلة · توك توك ${esc(user.plate)}</span></div><b>${earn} ج</b></div>
  <h2>رحلتك الحالية</h2>
  ${active.length?active.map(r=>rideCard(r,`<button class="btn" onclick="advance(${r.id})">${DRIVER_BTN[r.step]}</button>`+show(r),true)).join(''):'<div class="empty">مفيش رحلة شغّالة دلوقتي.</div>'}
  <h2>طلبات متاحة (${open.length})</h2>
  ${open.length?open.map(r=>rideCard(r,`<button class="btn" onclick="accept(${r.id})">اقبل الرحلة</button>`+show(r),true)).join(''):'<div class="empty">مفيش طلبات. الصفحة بتتحدّث لوحدها أول ما راكب يطلب.</div>'}`;
}
async function accept(id){const d=await api(`rides/${id}/accept`,{});if(d)sel=id;await refresh(true)}
async function advance(id){await api(`rides/${id}/advance`,{});await refresh(true)}

function render(){
  const a=document.getElementById('app'), y=window.scrollY;
  const keep=['fromTxt','toTxt','pax','aname','arole','aplate','aphone'].map(i=>{const e=document.getElementById(i);return e?[i,e.value]:null});
  const t=toast?`<div class="card err">${esc(toast)}</div>`:'';
  document.getElementById('mapwrap').hidden=!user;
  const ac=document.getElementById('acct');ac.hidden=!user;
  if(!user){a.innerHTML=t+authView()}
  else{
    ac.innerHTML=`${esc(user.name)} · ${user.role==='driver'?'سواق':'راكب'} <button onclick="logout()">خروج</button>`;
    a.innerHTML=t+(user.role==='rider'?riderView():driverView());
  }
  keep.forEach(p=>{if(p&&p[1]!==''){const e=document.getElementById(p[0]);if(e)e.value=p[1]}});
  const pw=document.getElementById('plwrap');if(pw)pw.hidden=document.getElementById('arole').value!=='driver';
  if(user){if(!map)initMap();else map.invalidateSize();drawMap()}
  window.scrollTo(0,y);
}
function boot(){if(booted)return;booted=true;setInterval(()=>refresh(false),3000)}

(async()=>{
  if(token){const d=await api('me');if(d)user=d;else token=null,lsSet(TKEY,null),toast=toast||''}
  render();
  if(user){boot();refresh(true)}
})();
</script>
</body>
</html>
